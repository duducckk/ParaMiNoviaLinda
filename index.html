<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&lt;3</title>
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=7">
</head>
<body>
    <svg class="bouquet" viewBox="0 0 600 720" role="group" aria-label="Ramo de flores">
        <defs>
            <!-- Ranunculus: layered petals, color comes from the <use> element -->
            <g id="ranun">
                <g fill="currentColor" stroke="rgba(70,20,35,.16)" stroke-width="1">
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(0)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(36)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(72)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(108)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(144)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(180)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(216)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(252)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(288)"/>
                    <ellipse cy="-24" rx="15" ry="24" transform="rotate(324)"/>
                </g>
                <g fill="currentColor" stroke="rgba(70,20,35,.22)" stroke-width="1" opacity=".85">
                    <ellipse cy="-12" rx="9" ry="13" transform="rotate(18)"/>
                    <ellipse cy="-12" rx="9" ry="13" transform="rotate(90)"/>
                    <ellipse cy="-12" rx="9" ry="13" transform="rotate(162)"/>
                    <ellipse cy="-12" rx="9" ry="13" transform="rotate(234)"/>
                    <ellipse cy="-12" rx="9" ry="13" transform="rotate(306)"/>
                </g>
                <circle r="7" fill="#F2D7A0"/>
            </g>

            <!-- Wildflower daisy -->
            <g id="daisy">
                <g fill="currentColor" stroke="rgba(80,60,40,.14)" stroke-width="1">
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(0)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(45)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(90)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(135)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(180)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(225)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(270)"/>
                    <ellipse cy="-27" rx="8" ry="19" transform="rotate(315)"/>
                </g>
                <circle r="11" fill="#D9A441"/>
                <circle r="11" fill="none" stroke="#B57E24" stroke-width="1.5" stroke-dasharray="1 2.5"/>
            </g>

            <!-- Bud with sepals -->
            <g id="bud">
                <path d="M0,-24 C13,-10 13,8 0,14 C-13,8 -13,-10 0,-24Z" fill="currentColor"/>
                <path d="M0,-24 C5,-8 5,4 0,14" fill="none" stroke="rgba(70,20,35,.2)" stroke-width="1.2"/>
                <path d="M0,12 Q-14,20 -12,30 Q-2,24 0,14Z M0,12 Q14,20 12,30 Q2,24 0,14Z" fill="#6F7F62"/>
            </g>

            <!-- Eucalyptus-style leaf -->
            <g id="leaf">
                <path d="M0,0 C16,-18 14,-46 0,-66 C-14,-46 -16,-18 0,0Z" fill="#8A9A7B"/>
                <path d="M0,-2 L0,-58" stroke="#55644A" stroke-width="1.2" fill="none"/>
            </g>

            <!-- Baby's breath sprig -->
            <g id="sprig">
                <path d="M0,0 L-2,-28" stroke="#6F7F62" stroke-width="1.2" fill="none"/>
                <g fill="#FBF7EE">
                    <circle cx="0" cy="0" r="3.5"/>
                    <circle cx="8" cy="-9" r="3"/>
                    <circle cx="-7" cy="-12" r="3.2"/>
                    <circle cx="4" cy="-20" r="2.8"/>
                    <circle cx="-4" cy="-28" r="2.6"/>
                    <circle cx="2" cy="-37" r="2.2"/>
                </g>
            </g>
        </defs>

        <!-- Table shadow -->
        <ellipse cx="300" cy="702" rx="190" ry="12" fill="rgba(60,40,30,.12)"/>

        <!-- Stems converge under the wrap -->
        <g fill="none" stroke="#6F7F62" stroke-width="3" stroke-linecap="round">
            <path class="stem" pathLength="1" d="M300,540 Q262,380 235,205"/>
            <path class="stem" pathLength="1" d="M300,540 Q350,380 372,190"/>
            <path class="stem" pathLength="1" d="M300,540 Q300,330 300,110"/>
            <path class="stem" pathLength="1" d="M300,540 Q210,470 170,330"/>
            <path class="stem" pathLength="1" d="M300,540 Q390,470 430,320"/>
            <path class="stem" pathLength="1" d="M300,540 Q270,450 262,330"/>
            <path class="stem" pathLength="1" d="M300,540 Q340,450 350,340"/>
            <path class="stem" pathLength="1" d="M300,540 Q200,520 120,420"/>
            <path class="stem" pathLength="1" d="M300,540 Q400,520 480,420"/>
            <path class="stem" pathLength="1" d="M300,540 Q262,300 215,120"/>
            <path class="stem" pathLength="1" d="M300,540 Q340,300 398,108"/>
        </g>

        <!-- Leaves -->
        <use href="#leaf" class="leaf" transform="translate(262,470) rotate(-42) scale(1.05)"/>
        <use href="#leaf" class="leaf" transform="translate(338,470) rotate(38) scale(1.05)"/>
        <use href="#leaf" class="leaf" transform="translate(205,405) rotate(-62) scale(.85)"/>
        <use href="#leaf" class="leaf" transform="translate(395,405) rotate(60) scale(.85)"/>
        <use href="#leaf" class="leaf" transform="translate(243,305) rotate(-28) scale(.7)"/>
        <use href="#leaf" class="leaf" transform="translate(360,300) rotate(26) scale(.7)"/>

        <use href="#leaf" class="leaf" transform="translate(180,470) rotate(-80) scale(.8)"/>
        <use href="#leaf" class="leaf" transform="translate(420,470) rotate(78) scale(.8)"/>
        <use href="#leaf" class="leaf" transform="translate(300,330) rotate(0) scale(.65)"/>

        <!-- Blooms, back to front -->
        <g transform="translate(300,110) rotate(-6) scale(.95)"><use data-msg="Te quiero mucho guapa papita" href="#ranun" class="bloom rose-deep" style="--d:1s"/></g>
        <g transform="translate(235,205) rotate(8)"><use data-msg="Me gustan tus besitos" href="#ranun" class="bloom blush" style="--d:1.1s"/></g>
        <g transform="translate(372,190) rotate(-10) scale(1.05)"><use data-msg="Eres la mas bonita" href="#ranun" class="bloom rose" style="--d:1.2s"/></g>
        <g transform="translate(170,330) rotate(-4) scale(.9)"><use data-msg="Me encanta tu naricita" href="#ranun" class="bloom apricot" style="--d:1.5s"/></g>
        <g transform="translate(350,340) rotate(12) scale(.9)"><use data-msg="Bonitas orejitas :D" href="#ranun" class="bloom blush" style="--d:1.6s"/></g>
        <g transform="translate(262,330) rotate(10)"><use data-msg="Durame siempre!" href="#daisy" class="bloom cream" style="--d:1.7s"/></g>
        <g transform="translate(430,320) rotate(5) scale(.9)"><use data-msg="Mua mua mua mua muamua" href="#ranun" class="bloom rose" style="--d:1.8s"/></g>
        <g transform="translate(120,420) rotate(-8) scale(.95)"><use data-msg="Papantla" href="#daisy" class="bloom cream" style="--d:1.9s"/></g>
        <g transform="translate(480,420) rotate(14) scale(.85)"><use data-msg="Quiero muchos abracitos!!!" href="#ranun" class="bloom rose-deep" style="--d:2s"/></g>
        <g transform="translate(215,120) rotate(-24) scale(.8)"><use href="#bud" class="bloom blush" style="--d:2.1s"/></g>
        <g transform="translate(398,108) rotate(26) scale(.75)"><use href="#bud" class="bloom rose-deep" style="--d:2.2s"/></g>

        <!-- Baby's breath -->
        <use href="#sprig" transform="translate(190,250) rotate(-10)"/>
        <use href="#sprig" transform="translate(420,240) rotate(12)"/>
        <use href="#sprig" transform="translate(150,380) rotate(-15)"/>
        <use href="#sprig" transform="translate(452,372) rotate(-15)"/>

        <!-- Kraft paper wrap: the left sheet folds over the right one -->
        <path d="M300,520 C340,500 400,470 425,455 L480,690 C400,705 340,700 300,690 Z" fill="#C49C77"/>
        <path d="M322,540 C318,600 308,650 300,690 L342,697 C348,640 350,590 322,540Z" fill="#000" opacity=".12"/>
        <path d="M175,455 C215,478 265,505 322,540 C318,600 308,650 300,690 C240,704 175,700 120,690 Z" fill="#D9B99B"/>
        <path d="M175,455 C215,478 265,505 322,540" fill="none" stroke="#EBD6BF" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M322,540 C318,600 308,650 300,690" fill="none" stroke="#A9825E" stroke-width="2"/>

        <!-- Twine bow -->
        <path d="M204,612 Q300,630 396,612 L393,632 Q300,650 207,632 Z" fill="#6E2F3F"/>
        <path d="M300,624 C258,566 196,580 222,626 C240,652 284,634 300,624Z" fill="#6E2F3F"/>
        <path d="M300,624 C342,566 404,580 378,626 C360,652 316,634 300,624Z" fill="#7E3848"/>
        <path d="M294,634 L268,704 L284,702 L300,646Z" fill="#6E2F3F"/>
        <path d="M306,634 L332,704 L316,702 L300,646Z" fill="#7E3848"/>
    </svg>
    <p class="note" id="note" aria-live="polite">Te amo papita :3</p>
    <p class="hint" id="hint">toca las flores ♥</p>
    <div class="ctl" id="ctl" hidden>
        <button type="button" id="pp" aria-label="Pausar música"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button type="button" id="mu" aria-label="Silenciar">♪</button>
    </div>
    <script>
        const note = document.getElementById('note');
        const hint = document.getElementById('hint');
        const ctl = document.getElementById('ctl');
        const pp = document.getElementById('pp');
        const mu = document.getElementById('mu');
        const blooms = [...document.querySelectorAll('.bloom[data-msg]')];
        let frame = null, paused = false, muted = false;

        const PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>', PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
        const yt = (func) => frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
        const paint = () => {
            pp.innerHTML = paused ? PLAY : PAUSE;
            pp.setAttribute('aria-label', paused ? 'Reproducir música' : 'Pausar música');
            mu.classList.toggle('off', muted);
            mu.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
        };

        // YouTube reports its real state back, so the buttons show it even if autoplay was blocked.
        addEventListener('message', (e) => {
            if (!frame || e.source !== frame.contentWindow) return;
            let d; try { d = JSON.parse(e.data); } catch { return; }
            const st = d.info && d.info.playerState;
            if (st === 1) paused = false; else if (st === 2 || st === 5 || st === -1) paused = true; else return;
            paint();
        });

        function startMusic() {
            frame = document.createElement('iframe');
            const o = location.protocol.startsWith('http') ? '&origin=' + encodeURIComponent(location.origin) : '';
            frame.src = 'https://www.youtube.com/embed/aOYPc3fJbvc?autoplay=1&loop=1&playlist=aOYPc3fJbvc&enablejsapi=1' + o;
            frame.allow = 'autoplay';
            frame.title = 'Música';
            frame.className = 'player';
            frame.onload = () => frame.contentWindow.postMessage(JSON.stringify({ event: 'listening' }), '*');
            document.body.append(frame);
            ctl.hidden = false;
        }

        pp.onclick = () => { yt(paused ? 'playVideo' : 'pauseVideo'); paused = !paused; paint(); };
        mu.onclick = () => { yt(muted ? 'unMute' : 'mute'); muted = !muted; paint(); };

        function tap(b) {
            hint.remove();
            blooms.forEach(x => x.classList.remove('nudge'));
            // Browsers block sound until a tap, so the song starts on the first flower.
            if (!frame) startMusic();
            note.textContent = b.dataset.msg;
            b.classList.remove('pop'); void b.getBoundingClientRect(); b.classList.add('pop');
        }

        blooms.forEach((b, n) => {
            b.setAttribute('tabindex', '0');
            b.setAttribute('role', 'button');
            b.setAttribute('aria-label', 'Flor ' + (n + 1));
            b.addEventListener('click', () => tap(b));
            b.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(b); }
            });
        });

        // If she hasn't touched anything after a few seconds, one flower gently invites a tap.
        setTimeout(() => { if (hint.isConnected) blooms[1].classList.add('nudge'); }, 7000);
    </script>
</body>
</html>
